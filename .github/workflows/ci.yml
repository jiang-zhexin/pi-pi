name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Nub and Node.js
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub ci

      - name: Type-check
        run: nub run check

      - name: Lint
        run: nub run lint

      - name: Format check
        run: nub run fmt --check

      - name: Test
        run: nub run test --run
